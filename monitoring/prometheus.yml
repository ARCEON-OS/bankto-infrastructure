global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: bankto-production

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'bankto-api'
    static_configs:
      - targets: ['bankto-api:3000']
    metrics_path: /api/metrics
    scrape_interval: 15s

  - job_name: 'bankto-core'
    static_configs:
      - targets: ['bankto-core:4001']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'bankto-intell'
    static_configs:
      - targets: ['bankto-intell:4002']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'postgres-api'
    static_configs:
      - targets: ['postgres-exporter-api:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
