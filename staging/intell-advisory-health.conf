server {
  listen 8080;
  server_name _;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"bankto-intell-advisory-sentinel","mode":"synthetic-staging-non-executing"}';
  }

  location / {
    default_type application/json;
    return 404 '{"error":"not_found"}';
  }
}
