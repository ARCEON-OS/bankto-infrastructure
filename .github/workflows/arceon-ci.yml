name: ARCEON CI/CD — NestJS

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  pre-check:
    name: Pre-check (Compose + Static Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm infrastructure manifest
        run: test -f docker-compose.yml
      - name: Verify local environment files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Tracked environment file detected"
            exit 1
          fi
      - name: Validate Compose schema without interpolation
        run: docker compose config --no-interpolate --quiet

  build:
    name: Compose Topology Build
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose topology without interpolation
        run: docker compose config --no-interpolate > compose-topology.yml
      - uses: actions/upload-artifact@v4
        with:
          name: compose-topology
          path: compose-topology.yml
          retention-days: 7

  docker:
    name: Compose Topology Validate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Revalidate Compose schema without interpolation
        run: docker compose config --no-interpolate --quiet

  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.event.repository.name }}@${{ github.sha }} to staging"
      - run: echo "AEGIS verification — staging"

  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.event.repository.name }}@${{ github.sha }} to production"
      - run: echo "AEGIS verification — production"
      - name: Notify CTO Orchestrator
        run: |
          echo "ARCEON CTO Orchestrator notified — ${{ github.event.repository.name }} deployed"

  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()
    steps:
      - run: echo "CRITICAL — Auto rollback triggered for ${{ github.event.repository.name }}"
