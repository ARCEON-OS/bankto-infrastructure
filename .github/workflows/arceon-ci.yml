name: ARCEON CI/CD — NestJS

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  pre-check:
    name: Pre-check (Lint + Type + Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run type-check --if-present || npx tsc --noEmit
      - name: Security audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: arceon/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.event.repository.name }}@${{ github.sha }} to staging"
      - run: echo "AEGIS verification — staging"

  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.event.repository.name }}@${{ github.sha }} to production"
      - run: echo "AEGIS verification — production"
      - name: Notify CTO Orchestrator
        run: |
          echo "ARCEON CTO Orchestrator notified — ${{ github.event.repository.name }} deployed"

  rollback:
    name: Auto Rollback
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()
    steps:
      - run: echo "CRITICAL — Auto rollback triggered for ${{ github.event.repository.name }}"
