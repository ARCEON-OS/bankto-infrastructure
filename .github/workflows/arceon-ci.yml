name: BANKTO infrastructure topology qualification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-check:
    name: Pre-check (Compose + Static Security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm infrastructure manifest
        run: test -f docker-compose.yml
      - name: Verify local environment files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Tracked environment file detected"
            exit 1
          fi
      - name: Validate Compose schema without interpolation
        run: docker compose config --no-interpolate --quiet

  build:
    name: Compose Topology Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: pre-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render Compose topology without interpolation
        run: docker compose config --no-interpolate > compose-topology.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-topology
          path: compose-topology.yml
          retention-days: 7

  docker:
    name: Compose Topology Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Revalidate Compose schema without interpolation
        run: docker compose config --no-interpolate --quiet

