name: BANKTO™ Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ORG: arceon-os

jobs:

  # ── Lint & Type Check ──────────────────────────────────────────────────────

  lint-api:
    name: Lint bankto-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bankto-api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'bankto-api/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  lint-core:
    name: Lint bankto-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bankto-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'bankto-core/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  lint-intell:
    name: Lint bankto-intell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bankto-intell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'bankto-intell/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  lint-token:
    name: Compile bnkto-token contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bnkto-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: 'bnkto-token/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec hardhat compile
      - run: pnpm exec hardhat test

  # ── Docker Build & Push ────────────────────────────────────────────────────

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-api, lint-core, lint-intell, lint-token]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: bankto-api
            context: ./bankto-api
          - name: bankto-core
            context: ./bankto-core
          - name: bankto-intell
            context: ./bankto-intell
          - name: bankto-web
            context: ./bankto-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to ECS ──────────────────────────────────────────────────────────

  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run DB migrations — bankto-api
        run: |
          aws ecs run-task \
            --cluster bankto-production \
            --task-definition bankto-api-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET }}],securityGroups=[${{ secrets.ECS_SG }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"bankto-api","command":["npx","prisma","migrate","deploy"]}]}'
      - name: Run DB migrations — bankto-core
        run: |
          aws ecs run-task \
            --cluster bankto-production \
            --task-definition bankto-core-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNET }}],securityGroups=[${{ secrets.ECS_SG }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"bankto-core","command":["npx","prisma","migrate","deploy"]}]}'
      - name: Update ECS services
        run: |
          for svc in bankto-api bankto-core bankto-intell bankto-web; do
            aws ecs update-service \
              --cluster bankto-production \
              --service $svc \
              --force-new-deployment
          done
      - name: Wait for stability
        run: |
          for svc in bankto-api bankto-core bankto-intell bankto-web; do
            aws ecs wait services-stable \
              --cluster bankto-production \
              --services $svc
          done
